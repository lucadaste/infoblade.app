  <meta name="theme-color" content="#111111">
  <style>
    :root { --red: #ff5252; }
    .main { padding: 28px 48px 48px; max-width: 1040px; }
    @media (max-width: 700px) { .main { padding: 20px 20px 40px; } }
    html.ii-chat-embedded .main { max-width: min(1040px, calc(100vw - var(--ii-chat-w, 520px) - 96px)); }

    .back-link { display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: var(--text-soft); text-decoration: none; margin: -6px 0 18px -6px; padding: 6px 10px 6px 6px; border-radius: 8px; transition: color 0.15s, background 0.15s; }
    .back-link svg { width: 18px; height: 18px; transition: transform 0.15s; }
    .back-link:hover { color: var(--ink); background: var(--hover-tint); }
    .back-link:hover svg { transform: translateX(-2px); }

    /* Header */
    .s-head-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .s-logo { width: 42px; height: 42px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-family: 'Share Tech Mono', sans-serif; font-weight: 700; font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .s-name-wrap { flex: 1; min-width: 0; }
    .s-name { font-size: 15px; font-weight: 500; }
    .s-exchange { font-size: 11px; color: var(--muted); font-family: 'Share Tech Mono', sans-serif; letter-spacing: 0.3px; }
    .s-watch-btn { background: none; border: 1px solid var(--divider); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; padding: 7px 14px; transition: all 0.2s; font-family: 'Share Tech Mono', sans-serif; font-weight: 600; letter-spacing: 0.3px; flex-shrink: 0; }
    .s-watch-btn:hover { border-color: var(--accent); color: var(--accent); }
    .s-watch-btn.watching { border-color: var(--accent); color: var(--accent); background: rgba(0,230,118,0.06); }

    .s-price-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
    .s-price { font-family: 'Share Tech Mono', sans-serif; font-weight: 700; font-size: clamp(32px, 6vw, 44px); letter-spacing: -1.5px; line-height: 1; }
    .s-change { font-size: 14px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
    .s-change.pos { color: var(--accent); background: rgba(0,230,118,0.12); }
    .s-change.neg { color: var(--red); background: rgba(255,82,82,0.1); }
    .s-period { font-size: 13px; color: var(--muted); }
    .s-asof { font-size: 11px; color: var(--muted); margin-bottom: 24px; }

    /* Range tabs */
    .range-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .range-chip { font-family: 'Share Tech Mono', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .range-chip:hover { border-color: var(--ink); color: var(--ink); }
    .range-chip.active { background: var(--accent); color: #111111; border-color: var(--accent); }

    /* Chart — full-bleed on the page background, not boxed; it's the one
       thing on this page that should feel like data, not a dashboard widget */
    .s-chart-wrap { margin-bottom: 28px; }
    .chart-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 60px 0; }
    /* Fixed height so switching ranges never makes the page jump. */
    #chart-area { min-height: 222px; transition: opacity 0.15s; }
    #chart-area.is-loading { opacity: 0.45; }
    .error-msg { color: var(--red); font-size: 14px; padding: 16px; background: rgba(255,82,82,0.08); border: 1px solid rgba(255,82,82,0.2); border-radius: 6px; }
    /* Right gutter holds the price labels for the grid lines. */
    .chart-svg-wrap { position: relative; padding-right: 64px; }
    .chart-grid-label { position: absolute; right: 0; width: 58px; transform: translateY(-50%); font-family: 'Share Tech Mono', sans-serif; font-size: 11px; color: var(--muted); pointer-events: none; }
    .chart-svg-wrap:focus { outline: none; }
    .chart-svg-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
    .chart-axis-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; font-family: 'Share Tech Mono', sans-serif; }
    .chart-approx-note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .chart-crosshair { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--divider); pointer-events: none; opacity: 0; }
    .chart-dot { position: absolute; width: 8px; height: 8px; margin-left: -4px; margin-top: -4px; border-radius: 50%; border: 2px solid var(--card); pointer-events: none; opacity: 0; }
    .chart-tooltip { position: absolute; top: 0; transform: translate(-50%, -115%); background: var(--surface-2); border-radius: 7px; padding: 7px 10px; font-size: 11px; line-height: 1.5; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .chart-tooltip .tt-date { color: var(--muted); }
    .chart-tooltip .tt-val { font-family: 'Share Tech Mono', sans-serif; font-weight: 700; }

    /* Key stats — a flat data sheet, not six stamped-out dashboard tiles */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 22px; column-gap: 16px; margin: 0 0 36px; }
    @media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-tile-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .stat-tile-val { font-family: 'Share Tech Mono', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }

    /* AI CTA — the one deliberately accented moment on the page, so it
       doesn't read as just another gray card like everywhere else on the site */
    .ai-cta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; padding: 18px 20px 18px 18px; border-left: 2px solid var(--accent); background: linear-gradient(90deg, rgba(0,230,118,0.07), transparent 70%); }
    .ai-cta-text { flex: 1; min-width: 200px; }
    .ai-cta-title { font-family: 'Share Tech Mono', sans-serif; font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--accent); letter-spacing: 0.3px; text-transform: uppercase; }
    .ai-cta-sub { font-size: 13px; color: var(--text-soft); line-height: 1.55; }
    .ai-cta-btn { font-family: 'Share Tech Mono', sans-serif; font-size: 12px; font-weight: 700; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; text-decoration: none; white-space: nowrap; transition: all 0.15s; }
    .ai-cta-btn:hover { background: var(--accent); color: #111; }
    button.ai-cta-btn { cursor: pointer; }

    /* In-page AI analysis — same pipeline and look as the Stocks page panel */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    #ai-panel { display: none; flex-direction: column; gap: 14px; margin-top: 18px; animation: fadeUp 0.3s ease both; }
    #ai-panel.show { display: flex; }
    .ai-gate { padding: 8px 0; font-size: 14px; color: var(--text-soft); line-height: 1.6; }
    .ai-gate a { color: var(--accent); }
    .lw { display:flex; align-items:center; gap:10px; }
    .lw-dots { display:flex; gap:4px; flex-shrink:0; }
    .lw-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:lw-pulse 1.2s ease-in-out infinite; }
    .lw-dot:nth-child(2) { animation-delay:.2s; } .lw-dot:nth-child(3) { animation-delay:.4s; }
    @keyframes lw-pulse { 0%,80%,100% { opacity:.2; transform:scale(.75); } 40% { opacity:1; transform:scale(1); } }
    .lw-msg { font-family:'Share Tech Mono',sans-serif; font-size:13px; color:var(--muted); letter-spacing:.2px; transition:opacity .2s ease,transform .2s ease; }
    .overall-card { background: linear-gradient(135deg, rgba(0,230,118,0.04) 0%, transparent 60%); border: 1px solid rgba(0,230,118,0.18); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: fadeUp 0.3s ease both; }
    .overall-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    .overall-summary { font-size: 14px; line-height: 1.7; color: var(--ink); }
    .dir-badge { display: inline-flex; align-items: center; gap: 5px; font-family: 'Share Tech Mono', sans-serif; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 5px; letter-spacing: 0.6px; text-transform: uppercase; align-self: flex-start; }
    .dir-bullish  { background: rgba(42,158,79,0.12);   color: #2a9e4f; border: 1px solid rgba(42,158,79,0.3); }
    .dir-bearish  { background: rgba(200,64,64,0.10);   color: #c84040; border: 1px solid rgba(200,64,64,0.25); }
    .dir-uncertain{ background: rgba(136,136,136,0.08); color: var(--muted); border: 1px solid var(--border); }
    .ap-section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
    .group-card { background: var(--card); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: fadeUp 0.3s ease both; }
    .group-topic { font-family: 'Share Tech Mono', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.4; }
    .group-meta { font-size: 12px; color: var(--muted); }
    .ar-block { border-top: 1px solid var(--border); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; animation: fadeUp 0.3s ease both; }
    .ar-summary { font-size: 14px; line-height: 1.7; color: var(--ink); }
    .ar-row { font-size: 13px; line-height: 1.65; }
    .ar-row strong { color: var(--accent); font-weight: 600; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .ar-confidence { font-size: 12px; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--border); }
    .ar-details { display: none; flex-direction: column; gap: 10px; animation: fadeUp 0.25s ease both; }
    .btn-deep { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'Share Tech Mono', sans-serif; font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 5px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px; align-self: flex-start; margin-top: 2px; }
    .btn-deep:hover { border-color: var(--accent); color: var(--accent); }
    .ar-sources-toggle { background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; align-self: flex-start; }
    .ar-sources-toggle .toggle-arrow { display: inline-block; transition: transform 0.2s; font-style: normal; }
    .ar-sources-toggle.open .toggle-arrow { transform: rotate(90deg); }
    .ar-sources-list { display: none; flex-direction: column; gap: 3px; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-top: 2px; }
    .ar-sources-list.open { display: flex; }
    .ar-source-item { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tickers { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { font-family: 'Share Tech Mono', sans-serif; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 4px; letter-spacing: 0.5px; }
    .pill-up   { background: rgba(0,230,118,0.12); color: var(--accent); border: 1px solid rgba(0,230,118,0.25); }
    .pill-down { background: rgba(255,80,80,0.1);  color: #ff7070; border: 1px solid rgba(255,80,80,0.2); }
    .sectors { display: flex; gap: 8px; flex-wrap: wrap; }
    .sector-up   { font-size: 11px; padding: 3px 10px; border-radius: 4px; background: rgba(0,230,118,0.08); color: #a0cc00; border: 1px solid rgba(0,230,118,0.15); }
    .sector-down { font-size: 11px; padding: 3px 10px; border-radius: 4px; background: rgba(255,80,80,0.08); color: #cc5555; border: 1px solid rgba(255,80,80,0.15); }
    .ai-err { color: #ff7070; font-size: 12px; }
    .ai-events { display: flex; flex-direction: column; gap: 14px; }
    .ai-events-toggle { background: none; border: none; padding: 0; cursor: default; text-align: left; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
    .ai-events-toggle .toggle-arrow { display: none; font-style: normal; transition: transform 0.2s; }

    /* Wide screens: the AI section lives in the chat dock's pinned slot
       (chat-widget.js #ii-pinned), so the call and follow-up chat sit side
       by side with the chart. Below 1180px it stays under the stats. */
    @media (min-width: 1180px) {
      html.ii-chat-embedded.ii-quote-dock.ii-quote-pinned { --ii-chat-w: clamp(320px, 30vw, 440px); }
    }
    #ai-section.in-dock .ai-cta { flex-direction: column; align-items: stretch; gap: 12px; padding: 14px 16px; }
    #ai-section.in-dock .ai-cta-text { min-width: 0; }
    #ai-section.in-dock .ai-cta-btn { text-align: center; }
    #ai-section.in-dock #ai-panel { margin-top: 14px; gap: 12px; }
    #ai-section.in-dock .overall-card,
    #ai-section.in-dock .group-card { padding: 14px; }
    #ai-section.in-dock .group-topic { font-size: 13px; }
    #ai-section.in-dock .ai-events-toggle { cursor: pointer; }
    #ai-section.in-dock .ai-events-toggle .toggle-arrow { display: inline-block; }
    #ai-section.in-dock .ai-events-toggle.open .toggle-arrow { transform: rotate(90deg); }
    #ai-section.in-dock .ai-events:not(.open) { display: none; }
    /* Once a run starts the intro card collapses to a slim header row —
       the results are the content now. */
    #ai-section.ai-started .ai-cta { flex-direction: row; align-items: center; padding: 0; background: none; border-left: none; gap: 12px; }
    #ai-section.ai-started .ai-cta-sub { display: none; }
    #ai-section.ai-started .ai-cta-title { margin: 0; }
    #ai-section.ai-started .ai-cta-btn { border-color: var(--border); color: var(--muted); font-size: 11px; padding: 5px 11px; }
    #ai-section.ai-started .ai-cta-btn:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
    #ai-section.ai-started .ai-cta-btn:disabled { opacity: 0.6; cursor: default; }

    @keyframes skel-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--surface-2) 50%, var(--card) 75%); background-size: 200% 100%; animation: skel-shimmer 1.5s ease-in-out infinite; border-radius: 4px; }
  </style>
</head>

    <div class="s-price-row">
      <div class="s-price skeleton" id="s-price" style="height:40px;width:160px">&nbsp;</div>
      <div class="s-change" id="s-change" style="display:none"></div>
      <div class="s-period" id="s-period"></div>
    </div>
    <div class="s-asof" id="s-asof">&nbsp;</div>

    <div class="range-row" id="range-row">
      <button class="range-chip active" data-range="1d">1D</button>
      <button class="range-chip" data-range="5d">1W</button>
      <button class="range-chip" data-range="1mo">1M</button>
      <button class="range-chip" data-range="3mo">3M</button>
      <button class="range-chip" data-range="1y">1Y</button>
      <button class="range-chip" data-range="5y">5Y</button>
    </div>

    <div class="s-chart-wrap">
      <div id="chart-area"><div class="chart-empty">Loading…</div></div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <section id="ai-section">
    <div class="ai-cta">
      <div class="ai-cta-text">
        <div class="ai-cta-title">AI Analysis</div>
        <div class="ai-cta-sub">Today's news mapped to likely price impact, plus infoblade's overall directional call.</div>
      </div>
      <button class="ai-cta-btn" id="ai-cta-btn" type="button">Generate AI Analysis →</button>
    </div>
    <div id="ai-panel" aria-live="polite"></div>
    </section>
    <div id="ai-home"></div>
  </div>
</div>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const TICKER = (params.get('ticker') || '').toUpperCase().replace(/[^A-Z.\-]/g, '').slice(0, 10);
  const NAME   = params.get('name') || TICKER;

  // Tells chat-widget.js this page pins its own AI call in the dock, so it
  // skips its auto-asked ticker report (see placeAiSection below).
  window.iiQuotePinned = !!TICKER;
  if (TICKER) document.documentElement.classList.add('ii-quote-pinned');

  if (!TICKER) {
    document.getElementById('s-content').style.display = 'none';
    const err = document.getElementById('s-error');
    err.style.display = 'block';
    err.textContent = 'No ticker specified.';
    return;
  }

  document.title = `infoblade | ${TICKER}`;
  // Real logo when the CDN has one for this symbol, falling back to the
  // same letter-circle placeholder the grid cards use when it doesn't.
  (function () {
    const logoEl = document.getElementById('s-logo');
    logoEl.textContent = TICKER.slice(0, 3);
    const img = document.createElement('img');
    img.alt = '';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:50%';
    // Parqet first; FMP covers what it misses (recent IPOs, small caps).
    let triedFallback = false;
    img.onerror = () => {
      if (!triedFallback) { triedFallback = true; img.src = `https://financialmodelingprep.com/image-stock/${encodeURIComponent(TICKER)}.png`; return; }
      img.remove(); logoEl.textContent = TICKER.slice(0, 3);
    };
    img.onload  = () => { logoEl.textContent = ''; logoEl.appendChild(img); };
    img.src = `https://assets.parqet.com/logos/symbol/${encodeURIComponent(TICKER)}?format=png`;
  })();
  document.getElementById('s-name').textContent = NAME;
  document.getElementById('s-name').classList.remove('skeleton');
  document.getElementById('s-name').style.cssText = '';

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtPrice(p) {
    if (p == null) return '—';
    return '$' + p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtVolume(v) {
    if (v == null) return '—';
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return String(v);
  }

  // ── Watchlist (same localStorage shape feed.html's grid uses, so a watch
  // toggled here or there stays in sync). ──────────────────────────────────
  let watchlist = { sectors: [], tickers: [] };
  try { const s = localStorage.getItem('ii_watchlist'); if (s) watchlist = JSON.parse(s); } catch (_) {}
  function syncWatchBtn() {
    const btn = document.getElementById('s-watch-btn');
    const watching = watchlist.tickers.includes(TICKER);
    btn.textContent = watching ? '★ Watching' : '☆ Watch';
    btn.classList.toggle('watching', watching);
  }
  // Fire-and-forget sync to the account-wide watchlist — same pattern
  // markets.html uses. Without this, toggling a watch here only ever wrote
  // to localStorage, so the next visit to watchlist.html (which pulls the
  // server copy and overwrites localStorage with it) silently erased it.
  async function _swApi(method, body) {
    const t = await window._auth?.getToken();
    if (!t) return null;
    try {
      const r = await fetch('/api/user-watchlist?type=stocks', {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      return r.ok ? r.json() : null;
    } catch (_) { return null; }
  }
  window.toggleWatch = function () {
    if (watchlist.tickers.includes(TICKER)) {
      watchlist.tickers = watchlist.tickers.filter(t => t !== TICKER);
      _swApi('DELETE', { symbol: TICKER });
    } else {
      watchlist.tickers.push(TICKER);
      if (typeof gtag !== 'undefined') gtag('event', 'watchlist_ticker_added', { ticker: TICKER });
      _swApi('POST', { symbol: TICKER });
    }
    localStorage.setItem('ii_watchlist', JSON.stringify(watchlist));
    syncWatchBtn();
  };
  syncWatchBtn();

  // ── Straight segments between every point, like a real price chart —
  // smoothing rounds off the actual moves and hides how jagged price is. ──
  function linePathFor(points) {
    return points.map((p, i) => `${i ? 'L' : 'M'} ${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
  }

  const INDEX_PROXY_LABEL = { 'SPX': 'SPY (S&P 500 ETF)' };
  let currentRange = '1d';
  const _d = (p, opts) => new Date(p.t).toLocaleString('en-US', opts);
  // Tooltip: as precise as the bars are — time for intraday/hourly data,
  // date for daily, week-of for weekly.
  const RANGE_TIP = {
    '1d':  p => _d(p, { hour: 'numeric', minute: '2-digit' }),
    '5d':  p => _d(p, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    '1mo': p => _d(p, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    '3mo': p => _d(p, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    '1y':  p => _d(p, { month: 'short', day: 'numeric', year: 'numeric' }),
    '5y':  p => 'Week of ' + _d(p, { month: 'short', day: 'numeric', year: 'numeric' }),
  };
  // Axis endpoints: just enough to read the span at a glance.
  const RANGE_AXIS = {
    '1d':  p => _d(p, { hour: 'numeric', minute: '2-digit' }),
    '5d':  p => _d(p, { weekday: 'short', month: 'short', day: 'numeric' }),
    '1mo': p => _d(p, { month: 'short', day: 'numeric' }),
    '3mo': p => _d(p, { month: 'short', day: 'numeric' }),
    '1y':  p => _d(p, { month: 'short', year: 'numeric' }),
    '5y':  p => _d(p, { month: 'short', year: 'numeric' }),
  };
  const RANGE_PERIOD = { '1d': 'Today', '5d': 'Past week', '1mo': 'Past month', '3mo': 'Past 3 months', '1y': 'Past year', '5y': 'Past 5 years' };

  let chartResizeObs = null;
  function renderChart(series, approx, up, prevClose) {
    const area = document.getElementById('chart-area');
    if (chartResizeObs) { chartResizeObs.disconnect(); chartResizeObs = null; }
    if (!series || series.length < 2) {
      area.innerHTML = '<div class="chart-empty">No chart data for this range.</div>';
      return;
    }
    const fmt  = RANGE_TIP[currentRange]  || RANGE_TIP['1d'];
    const axis = RANGE_AXIS[currentRange] || RANGE_AXIS['1d'];
    const color = up ? 'var(--accent)' : 'var(--red)';

    const vals  = series.map(p => p.c);
    // 1D gets a dotted previous-close line, so keep it inside the frame.
    if (prevClose != null) vals.push(prevClose);
    const min   = Math.min(...vals), max = Math.max(...vals);
    const range = (max - min) || (max * 0.01) || 1;
    const H = 200, W = 100, PAD_X = 1.5, PAD_Y = 10;
    const plotW = W - PAD_X * 2, plotH = H - PAD_Y * 2;
    const points = series.map((p, i) => ({
      x: PAD_X + (i / (series.length - 1)) * plotW,
      y: PAD_Y + plotH - ((p.c - min) / range) * plotH,
    }));
    const linePath = linePathFor(points);
    const lastPt = points[points.length - 1];
    const areaPath = `${linePath} L ${lastPt.x.toFixed(2)},${H} L ${points[0].x.toFixed(2)},${H} Z`;
    const gradId = 'sChartGrad';
    const yOf = v => PAD_Y + plotH - ((v - min) / range) * plotH;

    // Horizontal grid at round price levels (~4 lines), labelled on the right.
    const rawStep = range / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= rawStep) || rawStep;
    const gridVals = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) gridVals.push(v);
    const gridLines = gridVals.map(v =>
      `<line x1="0" x2="${W}" y1="${yOf(v).toFixed(2)}" y2="${yOf(v).toFixed(2)}" stroke="var(--divider)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
    const gridLabels = gridVals.map(v =>
      `<div class="chart-grid-label" style="top:${(yOf(v) / H * 100).toFixed(2)}%">${esc(fmtPrice(v))}</div>`).join('');
    const prevLine = prevClose != null
      ? `<line x1="0" x2="${W}" y1="${yOf(prevClose).toFixed(2)}" y2="${yOf(prevClose).toFixed(2)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>`
      : '';

    area.innerHTML = `
      <div class="chart-svg-wrap" id="s-chart-wrap" tabindex="0" role="slider" aria-orientation="horizontal"
           aria-label="${esc(TICKER)} price" aria-valuemin="0" aria-valuemax="${points.length - 1}"
           aria-valuenow="${points.length - 1}">
        <svg id="s-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block;overflow:visible">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${gridLines}
          ${prevLine}
          <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
          <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="chart-grid-labels" style="position:absolute;top:0;right:0;height:${H}px;width:64px">${gridLabels}</div>
        <div class="chart-crosshair" id="s-crosshair"></div>
        <div class="chart-dot" id="s-end-dot" style="background:${color};opacity:1"></div>
        <div class="chart-dot" id="s-dot"></div>
        <div class="chart-tooltip" id="s-tooltip"><span class="tt-date"></span> · <span class="tt-val"></span></div>
        <div class="chart-axis-row"><span>${esc(axis(series[0]))}</span><span>${esc(axis(series[series.length - 1]))}</span></div>
      </div>
      ${approx ? `<div class="chart-approx-note">Shaped from ${esc(INDEX_PROXY_LABEL[TICKER] || 'a tracking ETF')} — ${esc(TICKER)} has no direct tick data, so this line approximates its path rather than plotting the index itself.</div>` : ''}`;

    const wrap     = document.getElementById('s-chart-wrap');
    const svgEl    = document.getElementById('s-svg');
    const crosshair = document.getElementById('s-crosshair');
    const dot       = document.getElementById('s-dot');
    const endDot    = document.getElementById('s-end-dot');
    const tooltip   = document.getElementById('s-tooltip');
    const ttDate    = tooltip.querySelector('.tt-date');
    const ttVal     = tooltip.querySelector('.tt-val');

    // SVG points live in a stretched viewBox (preserveAspectRatio="none") —
    // never draw a shape directly in that space, it renders as a squashed
    // ellipse. Always convert to real rendered pixels first.
    function pxpy(idx) {
      const pt = points[idx];
      const rect = svgEl.getBoundingClientRect();
      return {
        px: (pt.x / W) * rect.width,
        py: ((pt.y / H) * rect.height) + (rect.top - wrap.getBoundingClientRect().top),
      };
    }
    function placeEndDot() {
      const { px, py } = pxpy(points.length - 1);
      endDot.style.left = px + 'px';
      endDot.style.top  = py + 'px';
    }
    placeEndDot();
    chartResizeObs = new ResizeObserver(placeEndDot);
    chartResizeObs.observe(svgEl);

    function showAt(idx) {
      idx = Math.max(0, Math.min(points.length - 1, idx));
      const p = series[idx];
      const { px, py } = pxpy(idx);
      crosshair.style.left = px + 'px';
      crosshair.style.opacity = '1';
      dot.style.left = px + 'px';
      dot.style.top  = py + 'px';
      dot.style.background = color;
      dot.style.opacity = '1';
      tooltip.style.left = px + 'px';
      tooltip.style.top  = py + 'px';
      tooltip.style.opacity = '1';
      ttDate.textContent = fmt(p);
      ttVal.textContent  = fmtPrice(p.c);
      ttVal.style.color  = color;
      wrap.setAttribute('aria-valuenow', String(idx));
      return idx;
    }
    function hide() {
      crosshair.style.opacity = '0';
      dot.style.opacity = '0';
      tooltip.style.opacity = '0';
    }
    function indexFromClientX(clientX) {
      const rect = svgEl.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return Math.round(frac * (points.length - 1));
    }
    wrap.addEventListener('pointermove', e => showAt(indexFromClientX(e.clientX)));
    wrap.addEventListener('pointerleave', hide);
    let focusedIdx = points.length - 1;
    wrap.addEventListener('focus', () => showAt(focusedIdx));
    wrap.addEventListener('blur', hide);
    wrap.addEventListener('keydown', e => {
      let next = focusedIdx;
      if (e.key === 'ArrowLeft')       next = focusedIdx - 1;
      else if (e.key === 'ArrowRight') next = focusedIdx + 1;
      else if (e.key === 'Home')       next = 0;
      else if (e.key === 'End')        next = points.length - 1;
      else return;
      e.preventDefault();
      focusedIdx = showAt(next);
    });
  }

  // Open/day range/volume only come with the 1D response and the 52-week
  // range with 1Y/5Y — merge them so the tiles stay filled on every range.
  const stats = {};
  const STAT_KEYS = ['open', 'dayHigh', 'dayLow', 'prevClose', 'volume', 'week52High', 'week52Low', 'currency'];
  function mergeStats(q) {
    STAT_KEYS.forEach(k => {
      if (q[k] == null) return;
      if (q.range === '1d' || stats[k] == null) stats[k] = q[k];
    });
  }

  function renderStats(q) {
    const tiles = [
      ['Open',          fmtPrice(q.open)],
      ['Day Range',     (q.dayLow != null && q.dayHigh != null) ? `${fmtPrice(q.dayLow)} – ${fmtPrice(q.dayHigh)}` : '—'],
      ['Prev Close',    fmtPrice(q.prevClose)],
      ['52-Week Range', (q.week52Low != null && q.week52High != null) ? `${fmtPrice(q.week52Low)} – ${fmtPrice(q.week52High)}` : '—'],
      ['Volume',        fmtVolume(q.volume)],
      ['Currency',      q.currency || '—'],
    ];
    document.getElementById('stat-grid').innerHTML = tiles.map(([label, val]) => `
      <div class="stat-tile">
        <div class="stat-tile-label">${esc(label)}</div>
        <div class="stat-tile-val">${esc(val)}</div>
      </div>`).join('');
  }

  // One request per range, reused for a minute — switching back and forth
  // is instant, and the other ranges are prefetched after the first paint.
  const CACHE_MS = 60 * 1000;
  const rangeCache = {};
  function fetchRange(range) {
    const hit = rangeCache[range];
    if (hit && Date.now() - hit.at < CACHE_MS) return hit.p;
    const p = fetch(window.API_BASE + `/api/ticker-quote?ticker=${encodeURIComponent(TICKER)}&range=${encodeURIComponent(range)}`)
      .then(res => res.json())
      .then(q => {
        if (q.error) throw new Error(q.error);
        mergeStats(q);
        renderStats(stats);
        return q;
      });
    rangeCache[range] = { at: Date.now(), p };
    p.catch(() => { if (rangeCache[range] && rangeCache[range].p === p) delete rangeCache[range]; });
    return p;
  }

  function renderHeader(q) {
    document.getElementById('s-price').textContent = fmtPrice(q.price);
    document.getElementById('s-price').classList.remove('skeleton');
    document.getElementById('s-price').style.cssText = '';
    document.getElementById('s-exchange').textContent = q.exchangeName || '';
    // The API's own lookup is authoritative — overrides the ticker-only
    // fallback (and any wrong guess) a caller's URL ?name= might carry.
    if (q.companyName) {
      document.getElementById('s-name').textContent = q.companyName;
      document.title = `infoblade | ${q.companyName} (${TICKER})`;
    }
    document.getElementById('s-asof').textContent = q.asOf ? `As of ${new Date(q.asOf).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : '';
  }

  // The badge tracks the selected range: today's move vs. prior close on 1D,
  // otherwise the move from the first bar in the range to the live price.
  function periodChange(q) {
    if (q.range === '1d') return { abs: q.changeAbs, pct: q.changePct };
    const base = q.series && q.series.length ? q.series[0].c : null;
    if (base == null || q.price == null) return { abs: null, pct: null };
    return { abs: q.price - base, pct: Math.round((q.price - base) / base * 10000) / 100 };
  }

  let loadSeq = 0;
  async function loadData(range) {
    const seq = ++loadSeq;
    const area = document.getElementById('chart-area');
    if (area.querySelector('svg')) area.classList.add('is-loading');
    try {
      const q = await fetchRange(range);
      if (seq !== loadSeq) return; // a newer range was picked meanwhile
      renderHeader(q);
      const { abs, pct } = periodChange(q);
      const chEl = document.getElementById('s-change');
      const up = pct != null ? pct >= 0 : true;
      if (pct != null) {
        chEl.style.display = '';
        chEl.className = 's-change ' + (up ? 'pos' : 'neg');
        chEl.textContent = `${up ? '+' : '-'}${abs != null ? fmtPrice(Math.abs(abs)) : ''} (${up ? '+' : ''}${pct.toFixed(2)}%)`;
      } else {
        chEl.style.display = 'none';
      }
      document.getElementById('s-period').textContent = RANGE_PERIOD[range] || '';
      renderChart(q.series, q.seriesApprox, up, range === '1d' ? q.prevClose : null);
    } catch (err) {
      if (seq !== loadSeq) return;
      area.innerHTML = `<div class="error-msg">Could not load price data for ${esc(TICKER)}.</div>`;
    } finally {
      if (seq === loadSeq) area.classList.remove('is-loading');
    }
  }

  document.querySelectorAll('#range-row .range-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.range === currentRange) return;
      document.querySelectorAll('#range-row .range-chip').forEach(b => b.classList.toggle('active', b === btn));
      currentRange = btn.dataset.range;
      loadData(currentRange);
    });
  });

  // ── AI analysis, generated right here under the stats — the same
  // pipeline feed.html's per-stock panel runs (news groups → per-event
  // calls + an overall directional call), so results match across pages. ──
  const AI_IMPACT = '1 month';
  const AI_CATEGORY = 'any';
  const LW_STOCK = [
    'Fetching news across 12+ sources...',
    'Pulling Yahoo Finance technical data...',
    'Checking Polymarket for related bets...',
    'Scanning r/wallstreetbets for retail sentiment...',
    'Building weighted source consensus...',
    'Calling direction — bullish or bearish...',
    'Calibrating against our track record...',
  ];
  const LW_GROUP = [
    'Building weighted consensus from sources...',
    'Checking Polymarket for related prediction bets...',
    'Identifying winner and loser tickers...',
    'Calling direction — bullish or bearish...',
    'Calibrating confidence against our track record...',
  ];
  const LW_OVERALL = ['Synthesizing all news into an overall call...', 'Weighing bullish vs bearish signals...', 'Comparing to historical accuracy on this ticker...', 'Finalising direction and confidence...'];

  // Rotating loading message; stops itself once the element leaves the DOM.
  function lw(msgs, pad) {
    const wrap = document.createElement('div');
    wrap.className = 'lw';
    wrap.style.padding = pad || '14px 0';
    wrap.innerHTML = `<div class="lw-dots"><span class="lw-dot"></span><span class="lw-dot"></span><span class="lw-dot"></span></div><span class="lw-msg">${esc(msgs[0])}</span>`;
    const msg = wrap.querySelector('.lw-msg');
    let i = 0;
    const tid = setInterval(() => {
      if (!wrap.isConnected) { clearInterval(tid); return; }
      msg.style.opacity = '0'; msg.style.transform = 'translateY(3px)';
      setTimeout(() => { i = (i + 1) % msgs.length; msg.textContent = msgs[i]; msg.style.opacity = '1'; msg.style.transform = 'translateY(0)'; }, 220);
    }, 2600);
    return wrap;
  }
  function slot(parent) { const d = document.createElement('div'); parent.appendChild(d); return d; }
  function showLoading(el, msgs, pad) { el.innerHTML = ''; el.appendChild(lw(msgs, pad)); }

  async function authHeaders() {
    const t = await window._auth?.getToken();
    return t ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t } : { 'Content-Type': 'application/json' };
  }
  async function analyzePost(body) {
    const res = await fetch(window.API_BASE + '/api/analyze', { method: 'POST', headers: await authHeaders(), body: JSON.stringify(body) });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    return d;
  }
  const errMsg = err => (window.getOfflineAwareMessage || (e => e?.message || ''))(err);

  function dirBadge(d) {
    const dir = (d.direction || '').toLowerCase();
    return dir === 'bullish' ? `<span class="dir-badge dir-bullish">↑ Likely Increase</span>`
      : dir === 'bearish' ? `<span class="dir-badge dir-bearish">↓ Likely Decrease</span>`
      : `<span class="dir-badge dir-uncertain">~ Unclear Impact</span>`;
  }

  function renderStockResult(el, d) {
    const pills = (list, cls) => list.map(t => `<span class="pill ${cls}">${esc(t)}</span>`).join('');
    const winnersHtml = (d.winners?.tickers || []).length
      ? `<div class="ar-row"><strong>Beneficiaries</strong>
          <div class="tickers" style="margin-top:4px">${pills(d.winners.tickers, 'pill-up')}</div>
          <div style="font-size:13px;color:var(--text-soft);margin-top:4px">${esc(d.winners.explanation || '')}</div>
        </div>` : '';
    const losersHtml = (d.losers?.tickers || []).length
      ? `<div class="ar-row"><strong>Likely Losers</strong>
          <div class="tickers" style="margin-top:4px">${pills(d.losers.tickers, 'pill-down')}</div>
          <div style="font-size:13px;color:var(--text-soft);margin-top:4px">${esc(d.losers.explanation || '')}</div>
        </div>` : '';
    const sectorsHtml = ((d.sectors?.positive || []).length || (d.sectors?.negative || []).length)
      ? `<div class="ar-row"><strong>Sectors in Play</strong>
          <div class="sectors" style="margin-top:4px">
            ${(d.sectors.positive || []).map(s => `<span class="sector-up">▲ ${esc(s)}</span>`).join('')}
            ${(d.sectors.negative || []).map(s => `<span class="sector-down">▼ ${esc(s)}</span>`).join('')}
          </div>
        </div>` : '';
    const crowdHtml = d.crowd_summary ? `<div class="ar-row"><strong>Crowd Signal</strong>${esc(d.crowd_summary)}</div>` : '';
    const conf = parseInt(d.confidence);
    const level = isNaN(conf) ? 3 : Math.max(1, Math.min(5, conf));
    const trackHtml = d.confidence && window.TrackRecord
      ? `<div class="ar-confidence track-record-row">${TrackRecord.slot(level, 'stocks', TrackRecord.horizonOf?.(d.impact_timeframe))}</div>` : '';
    const whyHtml = d.confidence && window.TrackRecord?.reasonText(d.confidence)
      ? `<div class="ar-row"><strong>Why</strong>${esc(TrackRecord.reasonText(d.confidence))}</div>` : '';
    const srcList = Array.isArray(d.sources) ? d.sources.filter(Boolean) : [];
    const sourcesHtml = srcList.length ? `
      <button class="ar-sources-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><i class="toggle-arrow">›</i> ${srcList.length} source${srcList.length !== 1 ? 's' : ''}</button>
      <div class="ar-sources-list">${srcList.map(s => `<span class="ar-source-item">${esc(s)}</span>`).join('')}</div>` : '';

    el.innerHTML = `<div class="ar-block">
      ${dirBadge(d)}
      ${d.why_it_matters ? `<div class="ar-summary">${esc(d.why_it_matters)}</div>` : ''}
      <button class="btn-deep" onclick="this.style.display='none';this.nextElementSibling.style.display='flex'">Deep Analysis →</button>
      <div class="ar-details">
        ${d.impact_timeframe ? `<div class="ar-row"><strong>Expected Timeframe</strong>${esc(d.impact_timeframe)}</div>` : ''}
        ${crowdHtml}${sectorsHtml}${winnersHtml}${losersHtml}${trackHtml}${whyHtml}
      </div>
      ${sourcesHtml}
    </div>`;
    if (window.TrackRecord) TrackRecord.fill(el);
  }

  async function runOverall(el, name, groups) {
    showLoading(el, LW_OVERALL, '10px 0');
    try {
      const d = await analyzePost({
        topic: `Net price direction for ${name} (${TICKER}) over ${AI_IMPACT}. Weigh all news and commit to a directional call.`,
        headlines: groups.flatMap(g => (g.headlines || []).slice(0, 3)).slice(0, 20),
        sources: [...new Set(groups.flatMap(g => g.sources || []))].slice(0, 15),
        impactTimeframe: AI_IMPACT, category: AI_CATEGORY,
      });
      el.innerHTML = `${dirBadge(d)}<div class="overall-summary" style="margin-top:8px">${esc(d.why_it_matters || '')}</div>`;
    } catch (_) {
      el.innerHTML = `<div class="ai-err">Could not load overall prediction.</div>`;
    }
  }

  async function runGroup(el, name, group) {
    showLoading(el, LW_GROUP);
    try {
      renderStockResult(el, await analyzePost({
        topic: `${group.topic}: impact on ${name} (${TICKER}) over ${AI_IMPACT}`,
        headlines: group.headlines || [], sources: group.sources || [],
        impactTimeframe: AI_IMPACT, category: AI_CATEGORY,
      }));
    } catch (err) {
      el.innerHTML = `<div class="ai-err">Analysis failed: ${esc(errMsg(err))}</div>`;
    }
  }

  async function runAiAnalysis() {
    const panel = document.getElementById('ai-panel');
    const btn = document.getElementById('ai-cta-btn');
    const name = document.getElementById('s-name').textContent.trim() || NAME;
    panel.classList.add('show');
    if (!window._auth?.user) {
      panel.innerHTML = `<div class="ai-gate">AI analysis needs a free account. <a href="/?modal=signin">Sign in / Create profile</a></div>`;
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Analyzing…';
    document.getElementById('ai-section').classList.add('ai-started');
    if (document.getElementById('ai-section').classList.contains('in-dock')) window.iiFocusPinned?.();
    showLoading(panel, LW_STOCK, '18px 0');
    try {
      const res = await fetch(`/api/analyze?stock=${encodeURIComponent(TICKER)}&stockName=${encodeURIComponent(name)}&timeframe=today`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const groups = data.groups || [];
      panel.innerHTML = '';
      if (!groups.length) {
        const note = slot(panel);
        note.style.cssText = 'color:var(--muted);font-size:14px';
        note.textContent = `No specific news found for ${TICKER} today — here's the general outlook.`;
        const out = slot(panel);
        showLoading(out, LW_GROUP);
        analyzePost({ topic: `${name} (${TICKER}) stock market outlook over ${AI_IMPACT}`, headlines: [], sources: [], impactTimeframe: AI_IMPACT, category: AI_CATEGORY })
          .then(d => renderStockResult(out, d))
          .catch(() => { out.innerHTML = `<div class="ai-err">Analysis failed.</div>`; });
      } else {
        const overall = slot(panel);
        overall.className = 'overall-card';
        overall.innerHTML = `<div class="overall-label">Overall Prediction · ${esc(name)} (${esc(TICKER)})</div>`;
        runOverall(slot(overall), name, groups);
        const lbl = slot(panel);
        lbl.className = 'ap-section-label ai-events-toggle';
        lbl.innerHTML = `<i class="toggle-arrow">›</i>${groups.length} market event${groups.length !== 1 ? 's' : ''} analyzed for ${esc(TICKER)}`;
        const events = slot(panel);
        events.className = 'ai-events';
        lbl.addEventListener('click', () => {
          if (!document.getElementById('ai-section').classList.contains('in-dock')) return;
          lbl.classList.toggle('open', events.classList.toggle('open'));
        });
        groups.forEach((group, idx) => {
          const card = slot(events);
          card.className = 'group-card';
          card.style.animationDelay = `${idx * 60}ms`;
          card.innerHTML = `<div class="group-topic">${esc(group.topic)}</div><div class="group-meta">${(group.sources || []).slice(0, 3).map(esc).join(' · ')}</div>`;
          runGroup(slot(card), name, group);
        });
      }
      btn.textContent = '↻ Refresh';
    } catch (err) {
      panel.innerHTML = `<div class="ai-err" style="font-size:13px">Failed to load news: ${esc(errMsg(err))}</div>`;
      btn.textContent = 'Try Again →';
    } finally {
      btn.disabled = false;
    }
  }
  // Wide screens dock the chat on the right (chat-widget.js) — move the AI
  // section into its pinned slot there, and back under the stats whenever
  // the dock goes away (resize below 1180px). The widget script loads after
  // this one, so wait for DOMContentLoaded before looking for the slot.
  function placeAiSection() {
    const sec = document.getElementById('ai-section');
    const pin = document.getElementById('ii-pinned');
    const docked = !!pin && document.documentElement.classList.contains('ii-chat-embedded');
    const target = docked ? pin : document.getElementById('ai-home');
    if (sec.parentNode !== target) target.appendChild(sec);
    sec.classList.toggle('in-dock', docked);
    if (pin) pin.hidden = !docked;
  }
  document.addEventListener('DOMContentLoaded', () => {
    placeAiSection();
    new MutationObserver(placeAiSection).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  });

  document.getElementById('ai-cta-btn').addEventListener('click', () => {
    if (typeof gtag !== 'undefined') gtag('event', 'stock_page_ai_analysis', { ticker: TICKER });
    if (window._onAuthReady) window._onAuthReady(runAiAnalysis); else runAiAnalysis();
  });

  loadData(currentRange).then(() => {
    document.querySelectorAll('#range-row .range-chip').forEach(b => {
      if (b.dataset.range !== currentRange) fetchRange(b.dataset.range).catch(() => {});
    });
  });
})();
</script>

<script>
// Reconcile the local stock watchlist with the account-wide one on sign-in:
// push up anything saved locally before this page ever synced to the server,
// and pull in anything saved from another device.
window._onAuthReady(async function (user) {
  if (!user) return;
  const remote = await _swApi('GET');
  const remoteTickers = new Set((remote && remote.symbols) || []);
  const localTickers = new Set(watchlist.tickers);
  localTickers.forEach(function (t) { if (!remoteTickers.has(t)) _swApi('POST', { symbol: t }); });
  let changed = false;
  remoteTickers.forEach(function (t) {
    if (t.startsWith('SECTOR:')) return;
    if (!localTickers.has(t)) { watchlist.tickers.push(t); changed = true; }
  });
  if (changed) {
    localStorage.setItem('ii_watchlist', JSON.stringify(watchlist));
    syncWatchBtn();
  }
});
</script>
